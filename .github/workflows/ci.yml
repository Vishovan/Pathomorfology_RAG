name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathology-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[ui,dev,mcp]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Local MCP integration
        run: |
          python scripts/check_mcp.py stdio
          python -m pathrag.mcp_calculators.network_server &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/check_mcp.py SSE
